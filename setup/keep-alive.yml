name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity.
# This pings the database once a day so the site never goes to sleep.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sS -f -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/settings?select=id" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
